spring:
  application:
    name: mstsoftware
  logging:
    level:
      org.flywaydb: DEBUG
  datasource:
    url: jdbc:mysql://localhost:3306/javaspringboot?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:database/migrations
    baseline-on-migrate: true