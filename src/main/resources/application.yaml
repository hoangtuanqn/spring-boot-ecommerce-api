server:
  port: 8000
  tomcat:
    relaxed-query-chars: '[,]'

app:
  schedule:
    refresh-token-cleanup: "0 0 2 * * *"
spring:
  application:
    name: mstsoftware
  #  threads:
  #    virtual:
  #      enabled: true
  profiles:
    active: local
  output:
    ansi:
      enabled: always
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:java_spring_boot}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    #    Hiển thị SQL ra console
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:database/migrations
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:changeme}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:changeme}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    mst:
      local:
        mstsoftware: debug
    org:
      flywaydb: DEBUG
      hibernate:
        stat: DEBUG
        orm:
          jdbc:
            bind: TRACE
jwt:
  secret: ${JWT_SECRET:a1M8O206XTw5ITl6NzReN3BKTTNVaWY1L1dnfWFPQjIjaysvV2F3Tm5fZA==}
  expiration: 900000
  issuer: https://mstsoftware.vn/
  refresh-token-ttl-days: 14